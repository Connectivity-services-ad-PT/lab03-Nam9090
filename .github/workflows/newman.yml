name: Newman Contract Tests

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  newman:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm install

      - name: Ensure reports directory exists
        run: mkdir -p reports

      - name: Verify dependencies installed
        run: npm ls prism-cli newman wait-on spectral-cli

      - name: Lint OpenAPI contracts
        run: npm run lint:contracts

      - name: Kill any processes on ports 4010 and 4011
        run: |
          pkill -f "prism" || true
          sleep 1

      - name: Start Prism mock servers with longer delay
        run: |
          npm run mock:camera > prism-camera.log 2>&1 &
          sleep 5
          npm run mock:vision > prism-vision.log 2>&1 &
          sleep 5
          echo "All mock servers started"
          ps aux | grep prism || true

      - name: Wait for mock servers with verbose output
        run: |
          echo "Waiting for Camera mock server on 4010..."
          npx wait-on http://localhost:4010/health --timeout 90000 --interval 2000 --verbose
          echo "Waiting for Vision mock server on 4011..."
          npx wait-on http://localhost:4011/health --timeout 90000 --interval 2000 --verbose

      - name: Run Newman contract tests
        continue-on-error: true
        run: |
          echo "Starting Newman tests..."
          npm run test:mock
          echo "Newman tests completed"

      - name: Check test results and logs
        if: always()
        run: |
          echo "=== Process status ==="
          ps aux | grep -E "prism|node" || true
          echo ""
          echo "=== Reports directory ==="
          ls -la reports/ || echo "Reports directory not found"
          echo ""
          echo "=== Prism Camera logs ==="
          cat prism-camera.log || echo "Camera logs not found"
          echo ""
          echo "=== Prism Vision logs ==="
          cat prism-vision.log || echo "Vision logs not found"
          echo ""
          echo "=== JUnit report ==="
          cat reports/newman-report-mock.xml || echo "JUnit report not found"

      - name: Upload Newman reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: newman-reports
          path: reports/
          if-no-files-found: ignore
