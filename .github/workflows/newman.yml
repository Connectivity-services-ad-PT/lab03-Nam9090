name: Newman Contract Tests

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  newman:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm install

      - name: Ensure reports directory exists
        run: mkdir -p reports

      - name: Lint OpenAPI contracts
        run: npm run lint:contracts

      - name: Start Prism mock servers
        run: |
          npm run mock:camera > prism-camera.log 2>&1 &
          npm run mock:vision > prism-vision.log 2>&1 &

          echo "Waiting for mock servers to initialize..."
          sleep 10

          echo "=== Running processes ==="
          ps aux | grep prism || true

      - name: Wait for mock servers
        run: |
          npx wait-on \
            http://localhost:4010/health \
            http://localhost:4011/health \
            --timeout 60000 \
            --interval 1000

      - name: Run Newman contract tests
        run: |
          npm run test:mock || true

      - name: Show debug information
        if: always()
        run: |
          echo "=== Reports directory ==="
          ls -la reports || true

          echo "=== Camera log ==="
          cat prism-camera.log || true

          echo "=== Vision log ==="
          cat prism-vision.log || true

          echo "=== Listening ports ==="
          netstat -tulpn || true

      - name: Upload Newman reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: newman-reports
          path: reports/
          if-no-files-found: ignore